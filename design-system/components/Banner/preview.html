<html><head><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0"><style>body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.6 var(--font-sans)} .ms{font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;font-size:16px;line-height:1;display:inline-block;font-feature-settings:"liga"} .chip{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:var(--r-chip);font:500 12px/1 var(--font-sans);border:1px solid var(--line);color:var(--muted)} .chip.ok{color:var(--ok);border-color:var(--ok-line)} .chip.danger{color:var(--danger);border-color:var(--danger-line)} .chip.info{color:var(--info);border-color:var(--info-line)}
.w{display:grid;gap:12px;padding:24px}.b{display:flex;align-items:center;gap:8px;font-size:13px}.wa{color:var(--danger)}.ok{color:var(--ok)}.b a{color:var(--info);text-decoration:underline;text-underline-offset:4px;margin-left:8px}</style></head><body><div class="w"><div class="b wa"><i class="ms">warning</i>结构还没确认，这里的内容会跟着结构变。<a>去确认结构</a></div><div class="b ok"><i class="ms">check_circle</i>结构已确认。之后修改任何一页，都需要重新确认。</div></div></body></html>
