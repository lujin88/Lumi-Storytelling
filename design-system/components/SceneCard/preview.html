<html><head><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0"><style>body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.6 var(--font-sans)} .ms{font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;font-size:16px;line-height:1;display:inline-block;font-feature-settings:"liga"} .chip{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:var(--r-chip);font:500 12px/1 var(--font-sans);border:1px solid var(--line);color:var(--muted)} .chip.ok{color:var(--ok);border-color:var(--ok-line)} .chip.warn{color:var(--warn);border-color:var(--warn-line)} .chip.danger{color:var(--danger);border-color:var(--danger-line)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px 24px}
.card{position:relative;display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-surface)}
.card:hover{background:#fbfaf7;border-color:#cfd3d9}.card:hover .e{opacity:1}
.e{position:absolute;right:8px;bottom:8px;color:var(--muted);opacity:0}
.th{width:120px;aspect-ratio:16/9;border:1px solid var(--line);border-radius:4px;background:var(--paper);display:flex;gap:6px;padding:10px;box-sizing:border-box}
.th b{display:block;flex:1;border:1px solid var(--muted);border-radius:2px}.th b+b{background:var(--ink);border-color:var(--ink)}
.top{display:flex;align-items:center;gap:8px;height:24px;margin-bottom:4px}
.num{font:14px/24px var(--font-serif);color:var(--muted);margin-right:auto}.num span{font:12px var(--font-sans);margin-left:8px}
h3{margin:0;font-size:14px;line-height:1.5}</style></head><body><div class="grid"><div class="card"><div class="th"><b></b><b></b></div><div><div class="top"><span class="num">02<span>对比</span></span><span style="display:inline-flex;align-items:center;gap:4px;font:500 12px/1 var(--font-sans);color:var(--info)"><i class="ms">help</i>待确认</span></div><h3>大家以为是工具太多，其实是没人负责交接</h3></div><i class="ms e">edit</i></div></div></body></html>
