<html><head><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0"><style>body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.6 var(--font-sans)} .ms{font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;font-size:16px;line-height:1;display:inline-block;font-feature-settings:"liga"} .chip{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:var(--r-chip);font:500 12px/1 var(--font-sans);border:1px solid var(--line);color:var(--muted)} .chip.ok{color:var(--ok);border-color:var(--ok-line)} .chip.danger{color:var(--danger);border-color:var(--danger-line)} .chip.info{color:var(--info);border-color:var(--info-line)}
.l{margin:16px 24px;border-top:1px solid var(--line)}
.r{display:grid;grid-template-columns:40px minmax(0,1fr) 48px;gap:16px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);font-weight:500}
.r i{justify-self:end;color:var(--muted);font-style:normal}
.o{background:var(--soft);box-shadow:inset 3px 0 0 var(--info);border-bottom:1px solid var(--line)}
.o .r{border:0;font-weight:600}.o .n{color:var(--info);font-weight:600}
.n{font:500 14px/1 var(--font-sans);color:var(--muted)}
.b{display:grid;grid-template-columns:112px 1fr;gap:8px 16px;margin:0 16px 0 72px;padding-bottom:16px;font-size:13px}.b dt{font-size:12px;color:var(--muted)}.b dd{margin:0}</style></head><body><div class="l"><div class="o"><div class="r"><span class="n">01</span><span>你怎么知道这件事真的重要？</span><i>−</i></div><dl class="b"><dt>对方在测</dt><dd>问题判断：是不是在解决一个值得解决的问题</dd><dt>最值得补的一个事实</dt><dd>涉及多少客户、多少钱或多少时间</dd></dl></div><div class="r"><span class="n">02</span><span>你是怎么发现真正的问题的？</span><i>+</i></div><div class="r"><span class="n">03</span><span>反对你的人，他的理由哪里是合理的？</span><i>+</i></div></div></body></html>
