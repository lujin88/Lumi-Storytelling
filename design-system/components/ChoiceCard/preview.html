<!-- @dsCard group="Inputs" height=160 -->
<html><head><style>body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.6 var(--font-sans)}
.wrap{padding:24px;display:flex;flex-direction:column;gap:16px;max-width:720px}
.lbl{font-size:13px;font-weight:600;margin:0 0 8px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.choice{height:40px;padding:0 16px;border-radius:var(--r-control);border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 14px var(--font-sans);cursor:pointer}
.choice:hover{background:var(--sunken)}
.choice[aria-pressed="true"]{background:var(--action-bg);border-color:var(--action-line)}
.choice:focus-visible{outline:2px solid var(--blue);outline-offset:2px}</style></head><body><div class="wrap">
<div><p class="lbl">用在哪</p><div class="grid" data-g><button class="choice" aria-pressed="true">面试</button><button class="choice" aria-pressed="false">汇报</button><button class="choice" aria-pressed="false">作品集</button></div></div>
<div><p class="lbl">准备讲多久</p><div class="grid c4" data-g><button class="choice" aria-pressed="false">5 分钟</button><button class="choice" aria-pressed="true">10 分钟</button><button class="choice" aria-pressed="false">15 分钟</button><button class="choice" aria-pressed="false">30 分钟</button></div></div>
</div><script>document.querySelectorAll('[data-g]').forEach(g=>g.querySelectorAll('.choice').forEach(b=>b.onclick=()=>g.querySelectorAll('.choice').forEach(x=>x.setAttribute('aria-pressed',x===b))))</script></body></html>
