<html><head><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0"><style>body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.6 var(--font-sans)}
.ms{font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;font-size:18px;line-height:1;display:inline-block;-webkit-font-feature-settings:"liga";font-feature-settings:"liga"}
.wrap{padding:24px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.row{display:flex;flex-wrap:wrap;gap:8px;padding:24px}
.choice{min-height:64px;min-width:160px;padding:12px 16px;border-radius:var(--r-control);border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;justify-content:center;gap:2px;text-align:left;font-family:var(--font-sans);color:var(--ink);cursor:pointer}
.choice:hover{background:var(--soft)}
.choice.on{border-color:var(--ink);background:var(--selected)}
.choice strong{font-size:14px;font-weight:600}.choice span{font-size:12px;color:var(--muted)}</style></head><body><div class="row"><button class="choice on"><strong>设计经理</strong><span>看判断和影响</span></button><button class="choice"><strong>同组设计师</strong><span>看过程和细节</span></button><button class="choice"><strong>跨职能伙伴</strong><span>看协作和结果</span></button></div></body></html>
