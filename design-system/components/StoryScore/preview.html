<!-- @dsCard group="Feedback" height=260 -->
<html><head><style>
:root{--paper:#f7f5f0;--surface:#fff;--line:#e3e1db;--ink:#252a38;--muted:#677181;--ok:#4f7a4d;--action-ink:#526787;--motion-ease-out:cubic-bezier(.23,1,.32,1);--motion-ease-move:cubic-bezier(.77,0,.175,1)}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{padding:24px;display:grid;gap:16px;align-items:start}.toolbar{display:flex;align-items:center;gap:12px}.toolbar button{height:40px;padding:0 16px;border:0;border-radius:6px;background:var(--ink);color:#fff;font:600 13px/1 inherit;cursor:pointer}.toolbar span{font-size:12px;color:var(--muted)}
.card{width:300px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.head{display:grid;grid-template-columns:48px 1fr 16px;gap:12px;align-items:center;padding:8px 12px}
.ring{position:relative;width:48px;height:48px;display:block}.ring svg{position:absolute;inset:0}.ring img{position:absolute;inset:7px;width:34px;height:34px;object-fit:contain;overflow:visible;transform-origin:50% 60%;animation:face-idle 6000ms var(--motion-ease-move) infinite}
.ring.react img{animation:face-react 240ms var(--motion-ease-out) both}
.l{font-size:12px;color:var(--muted);line-height:16px}.n{font-weight:600;font-size:16px;line-height:21px}.n span{color:var(--muted);font-weight:400;font-size:13px}.chev{width:8px;height:8px;border:solid var(--muted);border-width:0 1.5px 1.5px 0;transform:rotate(45deg) translateY(-3px)}
@keyframes face-idle{0%,72%,94%,100%{transform:none}78%{transform:translateY(-1px) rotate(-1deg)}86%{transform:translateY(0) rotate(.75deg)}}
@keyframes face-react{0%{transform:none}42%{transform:translateY(-1px) scale(1.05)}100%{transform:none}}
@media(prefers-reduced-motion:reduce){.ring img,.ring.react img{animation:none}}
</style></head><body><div class="wrap">
<div class="toolbar"><button type="button" id="raise">分数 +1</button><span>静置可看低频 idle；点击看一次 score-rise reaction</span></div>
<div class="card"><div class="head"><span class="ring" style="--p:60%"><svg width="48" height="48" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="15" fill="none" stroke="var(--line)" stroke-width="3"/><circle id="progress" cx="18" cy="18" r="15" fill="none" stroke="var(--ok)" stroke-width="3" stroke-linecap="round" stroke-dasharray="56.5 94.2" transform="rotate(-90 18 18)"/></svg><img id="face" src="../../../assets/lumi/source/face-good.webp" alt=""></span><span><div class="l">故事评分</div><div class="n"><b id="score">6</b><span>/10</span></div><div class="l">只看完整度，内容还要你来打磨</div></span><span class="chev"></span></div></div>
</div><script>
const ring=document.querySelector('.ring'),score=document.querySelector('#score'),face=document.querySelector('#face'),progress=document.querySelector('#progress');
const faces=['face-low.webp','face-good.webp','face-top.webp'];
document.querySelector('#raise').addEventListener('click',()=>{const next=Math.min(10,Number(score.textContent)+1);score.textContent=next;face.src='../../../assets/lumi/source/'+faces[next>=9?2:next>=5?1:0];progress.setAttribute('stroke-dasharray',`${(94.2*next/10).toFixed(1)} 94.2`);ring.classList.remove('react');void ring.offsetWidth;ring.classList.add('react');ring.addEventListener('animationend',()=>ring.classList.remove('react'),{once:true})});
</script></body></html>
