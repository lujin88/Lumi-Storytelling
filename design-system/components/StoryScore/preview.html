<!-- @dsCard group="Feedback" height=610 -->
<html><head><style>
:root{--paper:#f7f5f0;--surface:#fff;--line:#e3e1db;--ink:#252a38;--muted:#677181;--ok:#4f7a4d;--action-ink:#526787;--motion-ease-out:cubic-bezier(.23,1,.32,1);--motion-ease-move:cubic-bezier(.77,0,.175,1)}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{padding:24px;display:grid;gap:20px;align-items:start}.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.toolbar button{height:40px;padding:0 16px;border:0;border-radius:6px;background:var(--ink);color:#fff;font:600 13px/1 inherit;cursor:pointer}.toolbar span,.caption{font-size:12px;color:var(--muted)}
.card{width:340px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.head{display:grid;grid-template-columns:48px 1fr 16px;gap:12px;align-items:center;padding:8px 12px}
.ring{position:relative;width:48px;height:48px;display:block}.ring svg{position:absolute;inset:0}.ring img{position:absolute;inset:10.5px;width:27px;height:27px;object-fit:contain;overflow:visible;transform-origin:50% 60%;animation:face-idle 6000ms var(--motion-ease-move) infinite}
.ring.react img{animation:face-react 240ms var(--motion-ease-out) both}
.l{font-size:12px;color:var(--muted);line-height:16px}.n{font-weight:600;font-size:16px;line-height:21px}.n span{color:var(--muted);font-weight:400;font-size:13px}.chev{width:8px;height:8px;border:solid var(--muted);border-width:0 1.5px 1.5px 0;transform:rotate(45deg) translateY(-3px)}
.states{display:grid;grid-template-columns:repeat(5,minmax(80px,1fr));gap:8px}.state{min-height:96px;padding:10px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);display:grid;justify-items:center;align-content:start;gap:6px}.state .ring img{animation:none}.state b{font-size:11px;font-weight:600;color:var(--muted);text-align:center}.state .pose-idle{transform:translateY(-1px) rotate(-1deg)}.state .pose-react{transform:translateY(-1px) scale(1.05)}
.semantics{display:grid;grid-template-columns:repeat(2,minmax(0,340px));gap:12px}.semantics .card{width:100%}.state-title{font-size:12px;font-weight:600;color:var(--action-ink);margin-bottom:6px}
@keyframes face-idle{0%,72%,94%,100%{transform:none}78%{transform:translateY(-1px) rotate(-1deg)}86%{transform:translateY(0) rotate(.75deg)}}
@keyframes face-react{0%{transform:none}42%{transform:translateY(-1px) scale(1.05)}100%{transform:none}}
@media(max-width:700px){.states{grid-template-columns:repeat(3,minmax(80px,1fr))}.semantics{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.ring img,.ring.react img{animation:none}}
</style></head><body><div class="wrap">
<div class="toolbar"><button type="button" id="raise">分数 +1</button><span>静置看低频 idle；点击看一次 score-rise reaction</span></div>
<div class="card"><div class="head"><span class="ring"><svg width="48" height="48" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="15" fill="none" stroke="var(--line)" stroke-width="3"/><circle id="progress" cx="18" cy="18" r="15" fill="none" stroke="var(--ok)" stroke-width="3" stroke-linecap="round" stroke-dasharray="56.5 94.2" transform="rotate(-90 18 18)"/></svg><img id="face" src="../../../assets/lumi/source/face-good.webp" alt=""></span><span><div class="l">故事评分</div><div class="n"><b id="score">6</b><span>/10</span></div><div class="l">预估 · 按完整度计算</div></span><span class="chev"></span></div></div>
<section><div class="state-title">27px 轮廓与动作极值</div><div class="states">
<div class="state"><span class="ring"><svg width="48" height="48" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15" fill="none" stroke="var(--line)" stroke-width="3"/></svg><img src="../../../assets/lumi/source/face-low.webp" alt=""></span><b>low · 静止</b></div>
<div class="state"><span class="ring"><svg width="48" height="48" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15" fill="none" stroke="var(--line)" stroke-width="3"/></svg><img src="../../../assets/lumi/source/face-good.webp" alt=""></span><b>good · 静止</b></div>
<div class="state"><span class="ring"><svg width="48" height="48" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15" fill="none" stroke="var(--line)" stroke-width="3"/></svg><img src="../../../assets/lumi/source/face-top.webp" alt=""></span><b>top · 静止</b></div>
<div class="state"><span class="ring"><svg width="48" height="48" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15" fill="none" stroke="var(--line)" stroke-width="3"/></svg><img class="pose-idle" src="../../../assets/lumi/source/face-top.webp" alt=""></span><b>idle · −1px/−1°</b></div>
<div class="state"><span class="ring"><svg width="48" height="48" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15" fill="none" stroke="var(--line)" stroke-width="3"/></svg><img class="pose-react" src="../../../assets/lumi/source/face-top.webp" alt=""></span><b>reaction · −1px/1.05</b></div>
</div></section>
<section><div class="state-title">两种评分来源</div><div class="semantics">
<div><div class="caption">未审稿 / 修改后</div><div class="card"><div class="head"><span class="ring"><svg width="48" height="48" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15" fill="none" stroke="var(--line)" stroke-width="3"/></svg><img src="../../../assets/lumi/source/face-good.webp" alt=""></span><span><div class="l">故事评分</div><div class="n"><b>6</b><span>/10</span></div><div class="l">预估 · 按完整度计算</div></span><span class="chev"></span></div></div></div>
<div><div class="caption">Claude 审稿后</div><div class="card"><div class="head"><span class="ring"><svg width="48" height="48" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15" fill="none" stroke="var(--line)" stroke-width="3"/></svg><img src="../../../assets/lumi/source/face-good.webp" alt=""></span><span><div class="l">故事评分</div><div class="n"><b>7</b><span>/10</span></div><div class="l">Claude 评分 · 完整度与具体度</div></span><span class="chev"></span></div></div></div>
</div></section>
</div><script>
const ring=document.querySelector('.card .ring'),score=document.querySelector('#score'),face=document.querySelector('#face'),progress=document.querySelector('#progress');
const faces=['face-low.webp','face-good.webp','face-top.webp'];
document.querySelector('#raise').addEventListener('click',()=>{const next=Math.min(10,Number(score.textContent)+1);score.textContent=next;face.src='../../../assets/lumi/source/'+faces[next>=9?2:next>=5?1:0];progress.setAttribute('stroke-dasharray',`${(94.2*next/10).toFixed(1)} 94.2`);ring.classList.remove('react');void ring.offsetWidth;ring.classList.add('react');ring.addEventListener('animationend',()=>ring.classList.remove('react'),{once:true})});
</script></body></html>
