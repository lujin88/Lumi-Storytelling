<html><head><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0"><style>body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.6 var(--font-sans)} .ms{font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;font-size:16px;line-height:1;display:inline-block;font-feature-settings:"liga"} .chip{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:var(--r-chip);font:500 12px/1 var(--font-sans);border:1px solid var(--line);color:var(--muted)} .chip.ok{color:var(--ok);border-color:var(--ok-line)} .chip.warn{color:var(--warn);border-color:var(--warn-line)} .chip.danger{color:var(--danger);border-color:var(--danger-line)}
.w{padding:24px;font-size:14px;color:var(--muted)}
.t{position:relative;display:inline-flex;vertical-align:middle;margin-left:4px;color:var(--ink)}
.p{position:absolute;left:-8px;top:calc(100% + 8px);white-space:nowrap;padding:8px 12px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--r-control);box-shadow:0 4px 16px rgba(37,42,56,.08);font-size:12px}
.p:after{content:"";position:absolute;left:14px;top:-5px;width:8px;height:8px;background:var(--surface);border-left:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg)}
.p a{color:var(--info);text-decoration:underline;text-decoration-color:var(--info-line);text-underline-offset:3px}</style></head><body><div class="w">六个问题。材料里有的已经标出来，缺的我一次问一个。<span class="t"><i class="ms">info</i><span class="p">方法参考 <a>Case Study Storytelling</a> · Mengxue Bi</span></span></div></body></html>
