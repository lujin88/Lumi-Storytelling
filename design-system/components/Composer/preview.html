<html><head><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0"><style>body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.6 var(--font-sans)}
.ms{font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;font-size:18px;line-height:1;display:inline-block;-webkit-font-feature-settings:"liga";font-feature-settings:"liga"}
.wrap{padding:24px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.c{display:flex;align-items:center;gap:8px;margin:24px;min-height:48px;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-surface)}
.c:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px #7e8fae26}
.c textarea{flex:1;min-width:0;height:36px;border:0;resize:none;outline:none;padding:8px;font:14px var(--font-sans);color:var(--ink);background:transparent}
.ib{width:36px;height:36px;border-radius:var(--r-control);border:0;background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.ib.send{background:transparent;border:0;color:var(--ink)}</style></head><body><div class="c"><button class="ib" aria-label="上传"><i class="ms">add</i></button><textarea placeholder="写下你的回答…"></textarea><button class="ib send" aria-label="发送"><i class="ms">keyboard_return</i></button><button class="ib" aria-label="语音"><i class="ms">mic</i></button></div></body></html>
