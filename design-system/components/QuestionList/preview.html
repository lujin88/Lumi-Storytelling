<html><head><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0"><style>body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.6 var(--font-sans)} .ms{font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;font-size:16px;line-height:1;display:inline-block;font-feature-settings:"liga"} .chip{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:var(--r-chip);font:500 12px/1 var(--font-sans);border:1px solid var(--line);color:var(--muted)} .chip.ok{color:var(--ok);border-color:var(--ok-line)} .chip.danger{color:var(--danger);border-color:var(--danger-line)} .chip.info{color:var(--info);border-color:var(--info-line)}
ol{list-style:none;margin:16px 24px;padding:0;border-top:1px solid var(--line)}
li{display:grid;grid-template-columns:40px minmax(0,1fr) 120px;gap:16px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer}
li:hover{background:#efede8}
li.cur{background:var(--soft);box-shadow:inset 3px 0 0 var(--info);cursor:default}
li.cur.ed{align-items:start}
.n{font:500 14px/1 var(--font-sans);color:var(--muted)} .cur .n{color:var(--info);font-weight:600}
.q{display:block;font-weight:500}.cur .q{font-weight:600}
.a{margin:2px 0 0;font-size:13px;color:var(--muted)}
textarea{width:100%;box-sizing:border-box;margin-top:8px;min-height:40px;padding:8px 12px;font:14px/1.6 var(--font-sans);border:1px solid var(--blue);border-radius:var(--r-control);box-shadow:0 0 0 3px #7e8fae26;resize:none;background:var(--surface)}
.act{display:flex;gap:12px;align-items:center;margin-top:8px;font-size:12px;color:var(--muted)}
.btn{height:32px;padding:0 12px;border-radius:var(--r-control);border:0;background:var(--ink);color:#fff;font:500 13px var(--font-sans)}
.lk{font-size:13px;color:var(--ink)}</style></head><body><ol><li><span class="n">01</span><div><span class="q">这个项目为什么重要？</span><p class="a">客户每周要等三天才能看到研究结论。</p></div><span><span class="chip ok">你的回答</span></span></li><li class="cur ed"><span class="n">02</span><div><span class="q">一开始大家以为问题是什么？</span><textarea>大家以为是工具太多，其实是步骤之间没人负责交接。</textarea><div class="act"><button class="btn">保存</button><span class="lk">取消</span><span>Enter 保存 · Esc 取消</span></div></div><span><span class="chip ok">你的回答</span></span></li><li><span class="n">03</span><div><span class="q">什么让它真的很难？</span></div><span><span class="chip danger">缺失</span></span></li></ol></body></html>
