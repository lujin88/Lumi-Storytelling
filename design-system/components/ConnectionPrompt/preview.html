<!-- @dsCard group="Feedback" height=450 -->
<html><head><style>
:root{--paper:#f7f5f0;--surface:#fff;--line:#e3e1db;--ink:#252a38;--muted:#677181;--danger:#9d4b49;--blue:#7e8fae;--action-bg:#e7ecf3;--action-line:#7e8fae;--action-ink:#526787}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;padding:24px;background:var(--paper);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.demo{display:grid;gap:28px;max-width:720px;margin:auto}.prompt{min-height:44px;padding:0;border:0;background:transparent;color:var(--danger);display:flex;align-items:center;gap:8px;text-align:left;font:500 13px/1.4 inherit;cursor:pointer}.prompt .icon{flex:0 0 16px}.prompt .action{color:var(--action-ink);text-decoration:underline;text-underline-offset:3px}.settings{border-top:1px solid var(--line)}.row{display:grid;grid-template-columns:160px minmax(0,1fr);gap:16px;padding:16px 12px;border-bottom:1px solid var(--line);border-radius:8px}.row.targeted{background:var(--action-bg);box-shadow:inset 3px 0 0 var(--action-ink);outline:2px solid var(--blue);outline-offset:2px}.row strong{display:block}.row small{display:block;color:var(--muted)}.field{display:grid;gap:8px}.controls{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}.field input{min-width:0;height:40px;border:1px solid var(--line);border-radius:6px;padding:0 12px;background:var(--surface);color:var(--ink);font:inherit}.connect{height:40px;padding:0 16px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font:600 13px/1 inherit;cursor:pointer}.help{justify-self:start;border:0;background:transparent;padding:0;color:var(--action-ink);font:500 13px/1.4 inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer}.guide{display:none;margin:0;padding:12px 16px;background:var(--surface);border-radius:8px;color:var(--muted);font-size:13px}.guide.open{display:block}.guide a{color:var(--action-ink)}
body.dark{--paper:#171a21;--surface:#1d222c;--line:#343b49;--ink:#f2f0ea;--muted:#a9afba;--danger:#e19a97;--blue:#9fb0cf;--action-bg:#232a36;--action-line:#9fb0cf;--action-ink:#a9bbd6}
@media(prefers-color-scheme:dark){body:not(.light){--paper:#171a21;--surface:#1d222c;--line:#343b49;--ink:#f2f0ea;--muted:#a9afba;--danger:#e19a97;--blue:#9fb0cf;--action-bg:#232a36;--action-line:#9fb0cf;--action-ink:#a9bbd6}}
@media(max-width:520px){body{padding:16px}.demo{gap:20px}.prompt{align-items:flex-start;flex-wrap:wrap}.prompt .action{margin-left:24px}.row{grid-template-columns:1fr;padding:16px 12px}.controls{grid-template-columns:1fr}.connect{width:100%}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style></head><body><main class="demo">
<button class="prompt" type="button" id="prompt" role="alert"><svg class="icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2.8 20h18.4L12 3Zm0 5.5v5m0 3.5v.1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>这一步要用 Gemini，现在还没连接。</span><span class="action">连接 Gemini</span></button>
<section class="settings" aria-label="设置"><div class="row" id="gemini" tabindex="-1"><div><strong>Gemini</strong><small>语音转文字</small></div><div class="field"><div class="controls"><input type="password" aria-label="Gemini API 密钥" placeholder="输入密钥"><button class="connect" type="button">连接</button></div><button class="help" type="button" aria-expanded="false" aria-controls="guide">在哪里拿密钥，怎么填？</button><ol class="guide" id="guide"><li><a href="https://ai.google.dev/gemini-api/docs/api-key" target="_blank" rel="noreferrer">在 Gemini 官方页面创建密钥 ↗</a></li><li>复制密钥，粘贴到上面的输入框，再点“连接”。</li><li>密钥只保存在这个浏览器里。</li></ol></div></div></section>
</main><script>
const params=new URLSearchParams(location.search),prompt=document.querySelector('#prompt'),row=document.querySelector('#gemini'),help=document.querySelector('.help'),guide=document.querySelector('#guide');
if(params.get('theme')==='dark')document.body.classList.add('dark');if(params.get('theme')==='light')document.body.classList.add('light');
function activate(){row.classList.add('targeted');row.scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});row.focus({preventScroll:true})}
function setHelp(open){help.setAttribute('aria-expanded',String(open));guide.classList.toggle('open',open)}
prompt.addEventListener('click',activate);help.addEventListener('click',()=>setHelp(help.getAttribute('aria-expanded')!=='true'));
if(params.get('state')==='targeted'){activate();setHelp(true)}
</script></body></html>
