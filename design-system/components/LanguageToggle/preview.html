<html><head><style>body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.6 var(--font-sans)}
.lp{display:inline-flex;gap:2px;padding:2px;height:32px;box-sizing:border-box;background:var(--sunken);border-radius:var(--r-control);margin:24px}
.lp button{height:28px;padding:0 8px;border:0;border-radius:var(--r-control);background:transparent;color:var(--muted);font:500 12px var(--font-sans);cursor:pointer}
.lp button[aria-pressed="true"]{background:var(--action-bg);color:var(--action-ink);font-weight:600}
.lp button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}</style></head><body><div class="lp"><button aria-pressed="true">中</button><button aria-pressed="false">EN</button></div><script>document.querySelectorAll('.lp button').forEach(b=>b.onclick=()=>document.querySelectorAll('.lp button').forEach(x=>x.setAttribute('aria-pressed',x===b)))</script></body></html>
